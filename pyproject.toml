[project]
name = "llm-tutorial"
version = "0.1.0"
description = "LLM 大语言模型快速入门教程"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.10.0",
    "datasets>=4.0.0",
    "torch==2.7.1",
    "transformers>=5.15.0,<6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
